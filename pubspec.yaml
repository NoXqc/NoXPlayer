name: nox_iptv
description: "VesperTV - an M3U/EPG IPTV player for Android phones, boxes, and Firesticks."
publish_to: 'none'
version: 3.53.1+183

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  video_player_hdr: ^1.2.0
  http: ^1.2.0
  xml: ^6.5.0
  provider: ^6.1.5+1
  shared_preferences: ^2.2.0
  intl: ^0.19.0
  path_provider: ^2.1.6
  cupertino_icons: ^1.0.6
  sqflite: ^2.3.0
  path: ^1.9.0
  wakelock_plus: ^1.8.0
  cached_network_image: ^3.4.1
  package_info_plus: ^10.2.1
  # Already pulled in transitively by cached_network_image — added
  # explicitly to build a persistent-storage CacheManager directly (see
  # lib/services/persistent_image_cache.dart) rather than relying on an
  # undeclared transitive API surface.
  flutter_cache_manager: ^3.4.1
  file: ^7.0.0
  # Already pulled in transitively by other packages — added explicitly
  # for ParentalPin's own PIN hashing rather than relying on an undeclared
  # transitive API surface (same reasoning as flutter_cache_manager above).
  crypto: ^3.0.3
  # Windows/Linux desktop only — plain sqflite has no implementation for
  # either (Android/iOS/macOS keep using its native one, untouched). See
  # main.dart's `databaseFactory` setup.
  sqflite_common_ffi: ^2.3.3
  # Windows-only playback — video_player_hdr (used on every other platform,
  # untouched) has no Windows implementation at all. Deliberately only the
  # Windows native-library package below, not macos/linux/android/ios ones
  # — see lib/screens/desktop_player_screen.dart's doc comment for why this
  # is a wholly separate, standalone player screen rather than a shared
  # abstraction threaded through PlaybackService/the existing mobile player
  # widgets.
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_windows_video: ^1.0.10
  # Used directly (not just transitively through video_player_hdr) by
  # multiview_screen.dart, to reach our vendored video_player_android's
  # setAudioTrackTypeDisabled — see third_party/video_player_android's own
  # doc comment on that method for why.
  video_player_android: ^2.12.2
  video_player_platform_interface: ^6.9.0
  # Windows only — Check for Updates has no silent-install path there
  # (unlike Android's FileProvider + package-installer intent, see
  # AppUpdateService's own doc comment), so it hands the release zip's
  # URL to the system browser instead and lets the user grab it that way.
  url_launcher: ^6.3.1
  # Windows only — this app never had real OS-level fullscreen on Windows
  # at all; the native runner (windows/runner/win32_window.cpp) only ever
  # shows a normal bordered window, so even maximizing it still leaves the
  # title bar (and the taskbar, unless auto-hidden) visible. Reported
  # directly as "can't go truly full screen, only like 98%". The app
  # always launches fullscreen now (main.dart's own WindowOptions) — no
  # toggle, no windowed mode — matching the TV-style, always-immersive
  # identity the Android TV layout already has. window_manager gives that
  # a real, well-tested `fullScreen`/`show` instead of hand-rolling raw
  # Win32 window-style changes.
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  # icon_flat.png doubles as the animated cold-start splash logo (see
  # main.dart's bootstrap screen) — it already carries its own gradient
  # backdrop, so it reads cleanly pulsing on its own rather than needing
  # the adaptive-icon foreground/background layers composited by hand.
  assets:
    - assets/icon/icon_flat.png

# Generates android/ic_launcher (legacy + adaptive) and the ios/web/macos/
# windows app icons from assets/icon/*.png (see assets/icon/gen_icon.py for
# how those source images were built). Run with `dart run
# flutter_launcher_icons`. The Android TV banner is separate — Android TV's
# leanback launcher has no adaptive-icon equivalent, so that's just a plain
# drawable replaced by hand (see android/app/src/main/res/drawable*/vespertv_banner.png).
flutter_launcher_icons:
  android: "vespertv_launcher"
  ios: true
  image_path: "assets/icon/icon_flat.png"
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 24
  web:
    generate: true
    image_path: "assets/icon/icon_flat.png"
  windows:
    generate: true
    image_path: "assets/icon/icon_flat.png"
  macos:
    generate: true
    image_path: "assets/icon/icon_flat.png"

# Vendored, patched copy of video_player_android (the real engine
# video_player_hdr delegates to on Android) — adds the Jellyfin FFmpeg
# audio-decoder extension and prefers it as a fallback when the device's
# own hardware decoder can't handle the format (fixes AC3/E-AC3 audio
# playing silently on Android TV boxes with no licensed Dolby decoder).
# See third_party/video_player_android's two patched files for exactly
# what changed from the plain pub.dev package (currently pinned to 2.12.2,
# matching what video_player_hdr: ^1.2.0 resolves to above) — needs manual
# re-sync if that version ever changes.
dependency_overrides:
  video_player_android:
    path: third_party/video_player_android
